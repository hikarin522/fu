name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Fu/Fu.csproj

      - name: Build
        run: dotnet build Fu/Fu.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish Fu/Fu.csproj -c Release -o publish --no-build

      - name: Setup static assets for GitHub Pages
        run: |
          # .NET 10 uses staticwebassets.endpoints.json for asset resolution
          # Copy it to wwwroot/_framework, generate blazor.boot.json (fallback), and importmap
          python3 << 'EOF'
          import json
          import os
          import re
          import shutil

          endpoints_file = 'publish/Fu.staticwebassets.endpoints.json'
          target_endpoints = 'publish/wwwroot/_framework/staticwebassets.endpoints.json'
          boot_file = 'publish/wwwroot/_framework/blazor.boot.json'
          index_file = 'publish/wwwroot/index.html'

          with open(endpoints_file, 'r') as f:
              data = json.load(f)

          # Copy endpoints file to _framework directory
          os.makedirs(os.path.dirname(target_endpoints), exist_ok=True)
          shutil.copy(endpoints_file, target_endpoints)
          print(f"Copied {endpoints_file} to {target_endpoints}")

          # Build resources and importmap from endpoints
          resources = {"assembly": {}, "runtime": {}}
          importmap_imports = {}

          for endpoint in data.get('Endpoints', []):
              route = endpoint.get('Route', '')
              props = {p['Name']: p['Value'] for p in endpoint.get('EndpointProperties', [])}

              if not route.startswith('_framework/'):
                  continue

              integrity = props.get('integrity', '')
              filename = route.replace('_framework/', '')

              # Categorize resources for blazor.boot.json
              if route.endswith('.wasm'):
                  if 'dotnet.native' in route:
                      resources['runtime'][filename] = integrity
                  else:
                      resources['assembly'][filename] = integrity
              elif route.endswith('.js') and 'dotnet' in route:
                  resources['runtime'][filename] = integrity
                  # Map non-fingerprinted name to fingerprinted file for importmap
                  base_name = re.sub(r'\.[a-z0-9]+\.js$', '.js', filename)
                  if base_name != filename:
                      importmap_imports[f"./{base_name}"] = f"./{filename}"
              elif route.endswith('.dat') and 'icu' in route.lower():
                  resources.setdefault('icu', {})[filename] = integrity

          # Generate blazor.boot.json (fallback for compatibility)
          boot_config = {
              "mainAssemblyName": "Fu",
              "resources": resources,
              "cacheBootResources": False,
              "debugLevel": 0
          }
          with open(boot_file, 'w') as f:
              json.dump(boot_config, f, indent=2)
          print(f"Generated {boot_file}")

          # Generate importmap and inject into index.html
          with open(index_file, 'r') as f:
              html = f.read()

          if importmap_imports:
              importmap = {"imports": importmap_imports}
              importmap_script = f'<script type="importmap">\n{json.dumps(importmap, indent=2)}\n</script>'

              # Insert importmap before the first script tag
              html = html.replace('<script src="coi-serviceworker.js">', f'{importmap_script}\n    <script src="coi-serviceworker.js">')

              print(f"Injected importmap into {index_file}")
              print(f"Importmap: {json.dumps(importmap, indent=2)}")

          with open(index_file, 'w') as f:
              f.write(html)

          print("Static assets setup complete")
          EOF

      - name: Change base href
        run: sed -i 's|<base href="/" />|<base href="/fu/" />|g' publish/wwwroot/index.html

      - name: Add cache busting to static files
        run: |
          TIMESTAMP=$(date +%s)
          sed -i "s|coi-serviceworker.js\"|coi-serviceworker.js?v=$TIMESTAMP\"|g" publish/wwwroot/index.html
          sed -i "s|js/webrtc.js\"|js/webrtc.js?v=$TIMESTAMP\"|g" publish/wwwroot/index.html
          sed -i "s|js/shogi-engine.js\"|js/shogi-engine.js?v=$TIMESTAMP\"|g" publish/wwwroot/index.html
          sed -i "s|css/app.css\"|css/app.css?v=$TIMESTAMP\"|g" publish/wwwroot/index.html
          sed -i "s|blazor.webassembly.js\"|blazor.webassembly.js?v=$TIMESTAMP\"|g" publish/wwwroot/index.html

      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
